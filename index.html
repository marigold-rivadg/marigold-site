<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Marigold Rooms & Breakfast</title>

  <!-- Styles -->
  <style>
    body { margin:0; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto; color:#222; }
    a { color:inherit; text-decoration:none; }
    header, section, footer { padding:60px 20px; max-width:1100px; margin:auto; }
    header { text-align:center; }
    .btn { display:inline-block; padding:12px 24px; border-radius:6px; background:#c7a24a; color:#fff; }
    footer { font-size:14px; color:#555; border-top:1px solid #eee; }
    .lang-switch { position:fixed; top:15px; right:15px; }
    .lang-btn { cursor:pointer; margin-left:6px; }

    /* Rooms */
    .rooms-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:24px; }
    .room-card { border:1px solid #eee; border-radius:10px; padding:20px; }

    /* Cookie banner */
    #cookieBanner {
      position:fixed; bottom:0; left:0; right:0;
      background:#111; color:#fff;
      padding:20px;
      display:none;
      z-index:999;
    }
    #cookieBanner.show { display:block; }
    #cookieBanner button { margin-right:10px; }

    /* Privacy modal */
    #privacyModal {
      position:fixed; inset:0;
      background:rgba(0,0,0,.6);
      display:none;
      align-items:center;
      justify-content:center;
      z-index:1000;
    }
    #privacyModal.active { display:flex; }
    .privacy-box {
      background:#fff;
      max-width:800px;
      width:90%;
      max-height:90vh;
      overflow:auto;
      padding:30px;
      border-radius:12px;
    }
    .privacy-tabs { margin-bottom:20px; }
    .privacy-tab {
      margin-right:10px;
      padding:8px 14px;
      border:1px solid #ccc;
      background:#f6f6f6;
      cursor:pointer;
    }
    .privacy-tab.active {
      background:#c7a24a;
      color:#fff;
      border-color:#c7a24a;
    }
    #closePrivacy {
      float:right;
      cursor:pointer;
      font-size:14px;
      color:#888;
    }
  </style>
</head>

<body>

  <!-- Language switch -->
  <div class="lang-switch">
    <span class="lang-btn" data-lang="it">IT</span> |
    <span class="lang-btn" data-lang="en">EN</span>
  </div>

  <!-- Hero -->
  <header>
    <h1 data-i18n="hero.title"></h1>
    <p data-i18n="hero.subtitle"></p>
    <a href="#booking" class="btn" data-i18n="hero.cta"></a>
  </header>

  <!-- Booking -->
  <section id="booking">
    <h2 data-i18n="booking.title"></h2>
    <form id="bookingForm">
      <input id="checkin" placeholder="Check-in" />
      <input id="checkout" placeholder="Check-out" />
      <button class="btn" type="submit" data-i18n="booking.submit"></button>
    </form>
  </section>

  <!-- Rooms -->
  <section>
    <h2 data-i18n="rooms.title"></h2>
    <p data-i18n="rooms.subtitle"></p>
    <div id="roomsGrid" class="rooms-grid"></div>
  </section>

  <!-- Footer -->
  <footer>
    <p>&copy; 2025 Marigold Rooms & Breakfast –
      <span data-i18n="footer.rights"></span>
    </p>
    <p data-i18n-html="footer.privacy_line"></p>
  </footer>

  <!-- Cookie banner -->
  <div id="cookieBanner">
    <strong data-i18n="cookie.title"></strong>
    <p data-i18n="cookie.text"></p>
    <button id="cookieAccept" data-i18n="cookie.accept"></button>
    <button id="cookieReject" data-i18n="cookie.reject"></button>
  </div>

  <!-- Privacy modal -->
  <div id="privacyModal">
    <div class="privacy-box">
      <span id="closePrivacy">✕</span>
      <div id="privacyContent"></div>
    </div>
  </div>

  <!-- SCRIPT -->

      cookie: {

        text: `We use technical cookies and, with your consent, analytics cookies to improve your experience. You can change preferences at any time.`,

        prefs: "Preferences"
      },
      modal: {
        title: "Privacy Policy",
        lang_it: "Italiano",
        lang_en: "English",
        it_html: `
          <h3>Informativa Privacy</h3>
          <p>Trattiamo i dati personali per gestire prenotazioni e rispondere alle richieste inviate tramite il sito. I dati sono trattati nel rispetto della normativa applicabile (GDPR).</p>
          <ul>
            <li><b>Titolare:</b> Marigold Rooms & Breakfast</li>
            <li><b>Finalità:</b> prenotazioni, richieste informazioni, adempimenti amministrativi</li>
            <li><b>Base giuridica:</b> esecuzione di misure precontrattuali/contrattuali, obblighi di legge, consenso (quando richiesto)</li>
            <li><b>Conservazione:</b> per il tempo necessario alle finalità e agli obblighi normativi</li>
            <li><b>Diritti:</b> accesso, rettifica, cancellazione, limitazione, opposizione, portabilità</li>
          </ul>
          <p>Per esercitare i diritti o richiedere informazioni: contatta il Titolare.</p>
        `,
        en_html: `
          <h3>Privacy Notice</h3>
          <p>We process personal data to manage bookings and respond to requests submitted through the website. Data are processed in accordance with applicable laws (GDPR).</p>
          <ul>
            <li><b>Controller:</b> Marigold Rooms & Breakfast</li>
            <li><b>Purposes:</b> bookings, information requests, administrative obligations</li>
            <li><b>Legal basis:</b> pre-contractual/contractual measures, legal obligations, consent (when required)</li>
            <li><b>Retention:</b> as long as needed for the stated purposes and legal duties</li>
            <li><b>Rights:</b> access, rectification, erasure, restriction, objection, portability</li>
          </ul>
          <p>To exercise your rights or request information: contact the Controller.</p>
        `
      },
      roomsData: [
        {
          key: "room1",
          name: "Standard Room",
          desc: "Simple and bright, perfect for one or two guests.",
          features: ["Double bed", "Private bathroom", "Wi-Fi", "Smart TV"],
          price: "from € 90 / night"
        },
        {
          key: "room2",
          name: "Deluxe Room",
          desc: "More space and comfort for a relaxing stay.",
          features: ["Queen bed", "Private bathroom", "Wi-Fi", "Air conditioning"],
          price: "from € 120 / night"
        },
        {
          key: "room3",
          name: "Suite",
          desc: "Maximum comfort for those who want the best.",
          features: ["Lounge area", "Private bathroom", "Wi-Fi", "Amenities kit"],
          price: "from € 150 / night"
        }
      ]
    }
  };

  const titles = { it: I18N.it.titles.page, en: I18N.en.titles.page };

  // Current language
  const langInit = localStorage.getItem('lang') || (document.documentElement.lang || 'it');
  let currentLang = (langInit === 'en') ? 'en' : 'it';

  // Apply i18n text (supports data-i18n and data-i18n-html)
  function applyI18n(lang){
    currentLang = lang;
    const dict = I18N[lang];

    // data-i18n (text content)
    $$('[data-i18n]').forEach(el=>{
      const key = el.getAttribute('data-i18n');
      const parts = key.split('.');
      let node = dict;
      for(const p of parts){ node = node?.[p]; }
      if(typeof node === 'string') el.textContent = node;
    });

    // data-i18n-html (innerHTML)
    $$('[data-i18n-html]').forEach(el=>{
      const key = el.getAttribute('data-i18n-html');
      const parts = key.split('.');
      let node = dict;
      for(const p of parts){ node = node?.[p]; }
      if(typeof node === 'string') el.innerHTML = node;
    });
  }

  // Rooms render
  function renderRooms(){
    const dict = I18N[currentLang];
    const container = document.getElementById('roomsGrid');
    if(!container) return;
    container.innerHTML = '';
    dict.roomsData.forEach(room=>{
      const card = document.createElement('div');
      card.className = 'room-card';
      card.innerHTML = `
        <div class="room-card__body">
          <h3>${room.name}</h3>
          <p>${room.desc}</p>
          <ul>${room.features.map(f=>`<li>${f}</li>`).join('')}</ul>
          <div class="room-card__price">${room.price}</div>
          <a class="btn btn--primary book-direct" href="${currentLang==='en' ? 'https://marigold.kross.travel/en' : 'https://marigold.kross.travel/'}" target="_blank" rel="noopener">
            ${I18N[currentLang].booking.book_direct}
          </a>
        </div>
      `;
      container.appendChild(card);
    });
  }

  // Date placeholder
  function setDatePlaceholder(lang){
    const ci = document.getElementById('checkin');
    const co = document.getElementById('checkout');
    if(!ci || !co) return;
    if(lang==='en'){
      ci.placeholder = "Check-in date";
      co.placeholder = "Check-out date";
    } else {
      ci.placeholder = "Data check-in";
      co.placeholder = "Data check-out";
    }
  }

  // Datepicker init (flatpickr, if present)
  function initDatepicker(lang){
    if(typeof flatpickr === 'undefined') return;
    const locale = (lang==='en') ? 'en' : 'it';
    const opts = {
      dateFormat: "Y-m-d",
      locale
    };
    const ci = document.getElementById('checkin');
    const co = document.getElementById('checkout');
    if(ci) flatpickr(ci, opts);
    if(co) flatpickr(co, opts);
  }

  // Booking links (if any in markup)
  function bindBookingLinks(){
    $$('.book-direct').forEach(a=>{
      a.href = (currentLang==='en' ? 'https://marigold.kross.travel/en' : 'https://marigold.kross.travel/');
    });
  }

  // Mobile menu (if any)
  function bindMenu(){
    const burger = document.getElementById('burger');
    const menu = document.getElementById('mobileMenu');
    if(!burger || !menu) return;

    burger.addEventListener('click', ()=>{
      menu.classList.toggle('open');
      burger.classList.toggle('open');
    });

    $$('#mobileMenu a').forEach(a=>{
      a.addEventListener('click', ()=>{
        menu.classList.remove('open');
        burger.classList.remove('open');
      });
    });
  }

  // Language switch
  function bindLangSwitch(){
    const btns = $$('.lang-btn');
    if(!btns.length) return;
    btns.forEach(b=>{
      b.addEventListener('click', ()=>{
        const lang = b.getAttribute('data-lang');
        if(lang) setLang(lang);
      });
    });
  }

  // Email template update (example placeholder)
  function updateEmailTemplate(lang){
    const subject = document.getElementById('emailSubject');
    const body = document.getElementById('emailBody');
    if(!subject || !body) return;

    if(lang==='en'){
      subject.value = "Information request – Marigold Rooms & Breakfast";
      body.value = "Hello,\n\nI would like to request information about...\n\nThank you.";
    } else {
      subject.value = "Richiesta informazioni – Marigold Rooms & Breakfast";
      body.value = "Ciao,\n\nVorrei chiedere informazioni riguardo...\n\nGrazie.";
    }
  }

  // Maps language (example placeholder)
  function setMapsLang(lang){
    const map = document.getElementById('mapEmbed');
    if(!map) return;
    // if you use a maps URL with language param, adjust here
    // (kept as-is if not needed)
  }

  // ----------------------------
  // ✅ FIX: Privacy links binding (delegation)
  // ----------------------------
  function bindPrivacyLinks(){
    // Event delegation: funziona anche dopo applyI18n() (innerHTML)
    document.addEventListener('click', (e) => {
      const a = e.target.closest('#openPrivacyFromBanner, #openPrivacyFromFooter');
      if(!a) return;
      e.preventDefault();
      privacyModal.classList.add('active');
    });
  }

  // Lingua & titoli
  function setLang(lang){
    localStorage.setItem('lang',lang); document.documentElement.lang=lang;
    document.title=(lang==='en'?titles.en:titles.it);
    document.querySelectorAll('.book-direct').forEach(a=>a.href=(lang==='en' ? 'https://marigold.kross.travel/en' : 'https://marigold.kross.travel/'));
    applyI18n(lang); setDatePlaceholder(lang); initDatepicker(lang); renderRooms(); setMapsLang(lang);

    // 🔧 FORZA AGGIORNAMENTO TESTI MENU MOBILE
    applyI18n(lang);

    // ✅ aggiorna template email in base alla lingua
    updateEmailTemplate(lang);
  }

  // ----------------------------
  // Init
  // ----------------------------

  // Menu
  bindMenu();
  bindLangSwitch();

  // Swiper (if present)
  if(typeof Swiper !== 'undefined' && document.querySelector('.swiper')){
    new Swiper('.swiper', {
      loop:true,
      pagination:{el:'.swiper-pagination',clickable:true},
      navigation:{nextEl:'.swiper-button-next',prevEl:'.swiper-button-prev'},
      autoplay:{delay:4000,disableOnInteraction:false},
      breakpoints:{768:{slidesPerView:2},1024:{slidesPerView:3}}
    });
  }

  // Privacy modal + cookie
  const privacyModal=document.getElementById('privacyModal');
  document.getElementById('closePrivacy').onclick=()=>privacyModal.classList.remove('active');
  privacyModal.addEventListener('click',(e)=>{ if(e.target===privacyModal) privacyModal.classList.remove('active'); });

  // ✅ bind link Privacy una sola volta (regge anche con cambio lingua)
  bindPrivacyLinks();

  const cookieKey='mgd_cookie_consent', banner=document.getElementById('cookieBanner');
  const acceptBtn=document.getElementById('cookieAccept'), rejectBtn=document.getElementById('cookieReject');
  const cookiePrefs=document.getElementById('cookiePrefs');

  function showBanner(){ if(banner) banner.classList.add('show'); }
  function hideBanner(){ if(banner) banner.classList.remove('show'); }
  function getConsent(){ try{ return JSON.parse(localStorage.getItem(cookieKey)||'null'); }catch(e){ return null; } }
  function setConsent(val){ localStorage.setItem(cookieKey, JSON.stringify(val)); }

  if(!getConsent()) showBanner();

  acceptBtn?.addEventListener('click', ()=>{ setConsent({analytics:true, ts:Date.now()}); hideBanner(); });
  rejectBtn?.addEventListener('click', ()=>{ setConsent({analytics:false, ts:Date.now()}); hideBanner(); });

  cookiePrefs?.addEventListener('click', (e)=>{
    e.preventDefault();
    // basic preferences action could open modal / settings
    privacyModal.classList.add('active');
  });

  // Privacy modal language tabs
  const privacyTabs = $$('.privacy-tab');
  const privacyContent = document.getElementById('privacyContent');

  function renderPrivacy(lang){
    const dict = I18N[lang].modal;
    if(!privacyContent) return;
    // Default show both in modal with tabs behavior
    privacyContent.innerHTML = `
      <div class="privacy-tabs">
        <button class="privacy-tab ${lang==='it'?'active':''}" data-priv="it">${dict.lang_it}</button>
        <button class="privacy-tab ${lang==='en'?'active':''}" data-priv="en">${dict.lang_en}</button>
      </div>
      <div class="privacy-body">
        <div class="privacy-pane" data-pane="it" style="display:${lang==='it'?'block':'none'}">${dict.it_html}</div>
        <div class="privacy-pane" data-pane="en" style="display:${lang==='en'?'block':'none'}">${dict.en_html}</div>
      </div>
    `;
  }

  // Open privacy from banner (link exists inside i18n-html string)
  // Note: link click is handled by delegated bindPrivacyLinks()

  // Handle tab switching inside modal (delegated)
  document.addEventListener('click', (e)=>{
    const btn = e.target.closest('.privacy-tab');
    if(!btn) return;
    e.preventDefault();

    const target = btn.getAttribute('data-priv');
    if(!target) return;

    $$('.privacy-tab').forEach(t=>t.classList.remove('active'));
    btn.classList.add('active');

    $$('.privacy-pane').forEach(p=>{
      p.style.display = (p.getAttribute('data-pane')===target) ? 'block' : 'none';
    });
  });

  // Initial language setup
  setLang(currentLang);

  // Render modal content based on currentLang (default tab)
  renderPrivacy(currentLang);

  // If language changes, update modal content too
  // (simple hook: re-render modal content on any lang-btn click)
  document.addEventListener('click',(e)=>{
    const b = e.target.closest('.lang-btn');
    if(!b) return;
    const lang = b.getAttribute('data-lang');
    if(lang) renderPrivacy(lang);
  });

  // Booking form (if exists)
  const bookingForm = document.getElementById('bookingForm');
  bookingForm?.addEventListener('submit', (e)=>{
    e.preventDefault();
    // simple redirect to booking engine
    const url = (currentLang==='en' ? 'https://marigold.kross.travel/en' : 'https://marigold.kross.travel/');
    window.open(url, '_blank', 'noopener');
  });

  // Contact form (basic)
  const contactForm = document.getElementById('contactForm');
  contactForm?.addEventListener('submit', (e)=>{
    e.preventDefault();
    // In a static site, you can integrate a provider or mailto
    const name = (document.getElementById('name')||{}).value || '';
    const email = (document.getElementById('email')||{}).value || '';
    const msg = (document.getElementById('message')||{}).value || '';
    const subject = encodeURIComponent((currentLang==='en' ? 'Contact request' : 'Richiesta contatto') + ' - Marigold');
    const body = encodeURIComponent(
      (currentLang==='en'
        ? `Name: ${name}\nEmail: ${email}\n\nMessage:\n${msg}`
        : `Nome: ${name}\nEmail: ${email}\n\nMessaggio:\n${msg}`
      )
    );
    window.location.href = `mailto:?subject=${subject}&body=${body}`;
  });

</script>

</body>
