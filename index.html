<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Marigold – Relax, Comfort e Libertà a Riva del Garda</title>
  <meta name="description" content="Marigold a Riva del Garda. Camere accoglienti, posizione comoda, parcheggio gratuito. Prenota al miglior prezzo.">
  <link rel="icon" type="image/png" href="/assets/brand/favicon.png">
  <meta name="theme-color" content="#ffaea3">

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme:{
        extend:{
          colors:{ coral:'#ffaea3', dark:'#333', offwhite:'#FAFAF9', sage:'#84A98C' },
          fontFamily:{ serif:['Playfair Display','serif'], sans:['Lato','system-ui','sans-serif'] }
        }
      }
    }
  </script>

  <!-- Fonts + Icons -->
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <!-- Flatpickr -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/it.js"></script>

  <!-- Swiper -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css"/>

  <style>
    html{scroll-behavior:smooth}
    .hero-bg{background-image:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.55)),url('/assets/hero/facciata-marigold.jpg');background-size:cover;background-position:center}
    .btn-grad{background:linear-gradient(90deg,#ffaea3 0%,#ff998c 100%)}
    .lift{transition:transform .2s,box-shadow .2s}
    .lift:hover{transform:translateY(-2px);box-shadow:0 12px 24px rgba(0,0,0,.12)}
    .svc-ico{width:56px;height:56px;border-radius:999px;display:grid;place-items:center;margin:0 auto 12px;background:#111;color:#fff}
  </style>
</head>

<body class="font-sans text-dark bg-offwhite antialiased">

<!-- NAV -->
<nav class="sticky top-0 w-full z-50 bg-white/90 backdrop-blur shadow-sm">
  <div class="max-w-7xl mx-auto px-4">
    <div class="flex justify-between items-center h-20">
      <div class="flex items-center gap-3">
        <img src="/assets/brand/logo.png" class="w-10 h-10"/>
        <span class="font-serif text-2xl font-bold">Marigold</span>
      </div>

      <div class="hidden md:flex gap-6 uppercase text-sm font-bold">
        <a href="#chi-siamo" data-i18n="nav.about"></a>
        <a href="#camere" data-i18n="nav.rooms"></a>
        <a href="#servizi" data-i18n="nav.services"></a>
        <a href="#contatti" data-i18n="nav.contact"></a>
        <a href="https://marigold.kross.travel/" class="btn-grad text-white px-5 py-2 rounded-full book-direct" data-i18n="cta.bookNow"></a>
        <button id="lang-it">IT</button>
        <button id="lang-en">EN</button>
      </div>

      <button id="mobile-menu-btn" class="md:hidden">
        <i class="fas fa-bars text-2xl"></i>
      </button>
    </div>
  </div>

  <div id="mobile-menu" class="hidden bg-white border-t">
    <a href="#chi-siamo" class="block p-4" data-i18n="nav.about"></a>
    <a href="#camere" class="block p-4" data-i18n="nav.rooms"></a>
    <a href="#servizi" class="block p-4" data-i18n="nav.services"></a>
    <a href="#contatti" class="block p-4" data-i18n="nav.contact"></a>
    <div class="flex gap-3 p-4">
      <button id="lang-it-m">IT</button>
      <button id="lang-en-m">EN</button>
    </div>
  </div>
</nav>

<!-- ABOUT -->
<section id="chi-siamo" class="py-20 px-4 max-w-6xl mx-auto grid md:grid-cols-2 gap-10">
  <img src="/assets/about/camera.jpg" class="rounded-lg shadow">
  <div>
    <span class="text-coral uppercase text-sm font-bold" data-i18n="about.kicker"></span>
    <h2 class="font-serif text-4xl font-bold mb-4" data-i18n="about.h"></h2>
    <p class="mb-4" data-i18n="about.p1"></p>
    <p data-i18n="about.p2"></p>
  </div>
</section>

<!-- SERVIZI -->
<section id="servizi" class="py-20 bg-white">
  <h2 class="text-center font-serif text-3xl font-bold mb-12" data-i18n="services.h"></h2>
  <div class="grid md:grid-cols-3 gap-12 max-w-6xl mx-auto px-4 text-center">
    <div><div class="svc-ico"><i class="fa fa-key"></i></div><h3 data-i18n="services.flex.h"></h3><p data-i18n="services.flex.p"></p></div>
    <div><div class="svc-ico"><i class="fa fa-tree"></i></div><h3 data-i18n="services.garden.h"></h3><p data-i18n="services.garden.p"></p></div>
    <div><div class="svc-ico"><i class="fa fa-tv"></i></div><h3 data-i18n="services.tv.h"></h3><p data-i18n="services.tv.p"></p></div>
    <div><div class="svc-ico"><i class="fa fa-wifi"></i></div><h3 data-i18n="services.wifi.h"></h3><p data-i18n="services.wifi.p"></p></div>
    <div><div class="svc-ico"><i class="fa fa-solar-panel"></i></div><h3 data-i18n="services.green.h"></h3><p data-i18n="services.green.p"></p></div>
    <div><div class="svc-ico"><i class="fa fa-parking"></i></div><h3 data-i18n="services.parking.h"></h3><p data-i18n="services.parking.p"></p></div>
    <div><div class="svc-ico"><i class="fa fa-volume-xmark"></i></div><h3 data-i18n="services.quiet.h"></h3><p data-i18n="services.quiet.p"></p></div>
  </div>
</section>

<!-- CONTATTI -->
<section id="contatti" class="py-20 text-center">
  <h2 class="font-serif text-3xl font-bold mb-4" data-i18n="contact.h"></h2>
  <p class="mb-6" data-i18n="contact.sub"></p>
</section>

<script>
/* =========================
   MOBILE MENU AUTO-CLOSE
========================= */
const mobileMenu = document.getElementById('mobile-menu');
document.getElementById('mobile-menu-btn').onclick = () =>
  mobileMenu.classList.toggle('hidden');

mobileMenu.querySelectorAll('a,button').forEach(el=>{
  el.addEventListener('click',()=>mobileMenu.classList.add('hidden'));
});

/* =========================
   I18N
========================= */
const I18N = {
  it:{
    'nav.about':'Chi Siamo','nav.rooms':'Camere','nav.services':'Servizi','nav.contact':'Contatti',
    'cta.bookNow':'Prenota Ora',
    'about.kicker':'La Nostra Storia',
    'about.h':'Benvenuti al Marigold.',
    'about.p1':'Ristrutturato con cura nel 2018, in Via dell\'Albola, un quartiere silenzioso ma strategico. Rifugio ideale a due passi dal centro.',
    'about.p2':'Accoglienza familiare e attenzione all\'ambiente grazie all\'impianto fotovoltaico. Parcheggio gratuito a 50 m.',
    'services.h':'I NOSTRI SERVIZI',
    'services.flex.h':'Check-in Flessibile','services.flex.p':'Nessun orario rigido: entra in libertà',
    'services.garden.h':'Giardino','services.garden.p':'Prenditi una pausa e rilassati all\'aperto!',
    'services.tv.h':'Smart TV','services.tv.p':'Giornata di pioggia? Goditi un bel film',
    'services.wifi.h':'Free Wi-Fi','services.wifi.p':'Ultravelocità con la tecnologia fibra ottica',
    'services.green.h':'Energia Verde','services.green.p':'Marigold è ecofriendly, grazie a un impianto fotovoltaico da 5kWh!',
    'services.parking.h':'Parcheggio Gratuito','services.parking.p':'È pubblico, situato a 50 m dalla struttura',
    'services.quiet.h':'Quiet Zone','services.quiet.p':'Indisturbato dai rumori del traffico urbano',
    'contact.h':'Contattaci','contact.sub':'Scrivici o chiamaci quando vuoi'
  },
  en:{
    'nav.about':'About','nav.rooms':'Rooms','nav.services':'Amenities','nav.contact':'Contact',
    'cta.bookNow':'Book Now',
    'about.kicker':'Our Story',
    'about.h':'Welcome to Marigold.',
    'about.p1':'Carefully renovated in 2018, in Via dell\'Albola, a quiet yet strategic area. An ideal retreat just steps from the center.',
    'about.p2':'Warm hospitality and environmental care thanks to a photovoltaic system. Free parking 50 m away.',
    'services.h':'OUR AMENITIES',
    'services.flex.h':'Flexible Check-in','services.flex.p':'No fixed time: check in freely',
    'services.garden.h':'Garden','services.garden.p':'Take a break and relax outdoors',
    'services.tv.h':'Smart TV','services.tv.p':'Rainy day? Enjoy a good movie',
    'services.wifi.h':'Free Wi-Fi','services.wifi.p':'Ultra-fast fiber optic connection',
    'services.green.h':'Green Energy','services.green.p':'Marigold is eco-friendly thanks to a 5kWh photovoltaic system',
    'services.parking.h':'Free Parking','services.parking.p':'Public parking, 50 m from the property',
    'services.quiet.h':'Quiet Zone','services.quiet.p':'Away from urban traffic noise',
    'contact.h':'Contact us','contact.sub':'Write or call us anytime'
  }
};

function setLang(lang){
  document.documentElement.lang = lang;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    el.textContent = I18N[lang][el.dataset.i18n];
  });
  document.querySelectorAll('.book-direct').forEach(a=>{
    a.href = lang==='en'
      ? 'https://marigold.kross.travel/en'
      : 'https://marigold.kross.travel/';
  });
  localStorage.setItem('lang',lang);
}

['lang-it','lang-it-m'].forEach(id=>document.getElementById(id)?.addEventListener('click',()=>setLang('it')));
['lang-en','lang-en-m'].forEach(id=>document.getElementById(id)?.addEventListener('click',()=>setLang('en')));

setLang(localStorage.getItem('lang')||'it');
</script>

</body>
</html>
