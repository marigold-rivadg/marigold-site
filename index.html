<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>Marigold – Relax, Comfort e Libertà a Riva del Garda</title>
  <meta name="description" content="Marigold a Riva del Garda. Camere accoglienti, posizione comoda, parcheggio gratuito. Prenota al miglior prezzo.">
  <link rel="icon" type="image/png" href="/assets/brand/favicon.png">
  <link rel="apple-touch-icon" href="/assets/brand/favicon.png">
  <meta name="theme-color" content="#ffaea3">

  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme:{
        extend:{
          colors:{ coral:'#ffaea3', dark:'#333', offwhite:'#FAFAF9', sage:'#84A98C' },
          fontFamily:{ serif:['Playfair Display','serif'], sans:['Lato','system-ui','sans-serif'] }
        }
      }
    }
  </script>

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/it.js"></script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@10/swiper-bundle.min.css"/>

<style>
  html{scroll-behavior:smooth}

  :root{
    --shadow-soft: 0 10px 30px rgba(0,0,0,.08);
    --shadow-strong: 0 18px 50px rgba(0,0,0,.18);
    --radius-xl: 1.2rem;
  }

  body{
    letter-spacing: -0.01em;
  }

  .hero-bg{
    background-image:linear-gradient(rgba(0,0,0,.25),rgba(0,0,0,.55)),url('/assets/hero/facciata-marigold.jpg');
    background-size:cover;
    background-position:center;
  }

  .btn-grad{
    background:linear-gradient(135deg,#ffaea3 0%,#ff7f73 100%);
    box-shadow:0 10px 25px rgba(255,174,163,.35);
    transition:all .2s ease;
  }
  .btn-grad:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 35px rgba(255,174,163,.45);
  }

  .lift{
    transition:all .25s ease;
  }
  .lift:hover{
    transform:translateY(-6px);
    box-shadow:var(--shadow-strong);
  }

  img{
    transition:transform .5s ease;
  }
  .group:hover img{
    transform:scale(1.05);
  }

  nav,
  #cookieBanner,
  header .bg-white\/95{
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  .svc-ico{
    width:56px;height:56px;border-radius:999px;
    display:grid;place-items:center;margin:0 auto 12px;
    background:linear-gradient(135deg,#111,#2a2a2a);
    color:#fff;
    box-shadow:0 10px 25px rgba(0,0,0,.12);
  }

  section{scroll-margin-top:90px;}

  .bg-white{border-radius:var(--radius-xl);}
  .shadow-lg{box-shadow:var(--shadow-soft)!important;}

  .card-img{position:relative;overflow:hidden;border-radius:.9rem}
  .card-img img{width:100%;height:220px;object-fit:cover}
  .card-img .ov{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.25),rgba(0,0,0,.6))}
  .card-img .tx{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:flex-start;padding:1rem;color:#fff}

  .modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.5);z-index:80}
  .modal.active{display:flex}

  .aspect-3-4{position:relative;width:100%}
  .aspect-3-4:before{content:"";display:block;padding-top:133.333%}
  .aspect-3-4>img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:.75rem}

  .swiper-button-next,.swiper-button-prev{color:#fff;}
  .swiper-pagination-bullet{background-color:rgba(255,255,255,0.5);opacity:1;}
  .swiper-pagination-bullet-active{background-color:#fff;}

  .flatpickr-calendar{border:none;border-radius:1rem;box-shadow:0 20px 45px rgba(0,0,0,.15);overflow:hidden;}
  .flatpickr-months{background:linear-gradient(90deg,#ffaea3 0%,#ff998c 100%);color:#fff;}
  .flatpickr-day:hover{background:#ffaea3;color:#fff;}
  .flatpickr-day.selected{background:#333;color:#fff;}
</style>
</head>

<body class="font-sans text-dark bg-offwhite antialiased">

<!-- TUTTO IL TUO HTML RESTA IDENTICO SOTTO QUESTO PUNTO -->

<!-- (NON HO MODIFICATO JS, FUNZIONI, LINK, O STRUTTURA) -->

</body>
</html>
